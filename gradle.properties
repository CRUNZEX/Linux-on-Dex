# JVM: payload repacking + dexing of a large native payload needs headroom.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Native-lib extraction (required for exec of the QEMU payload) is configured
# via packaging.jniLibs.useLegacyPackaging in app/build.gradle.kts.
android.useAndroidX=true

kotlin.code.style=official
